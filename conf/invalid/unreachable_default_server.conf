# MUST BE REJECTED: a server without server_name is only reached as the default server:
# the first one on a listen. here every listen of the second server has
# one already, so nothing can reach it (decision 8).
# expect: config error, line 11: server without server_name can never be reached: each of its listens already has a default server

server {
	listen					8080;
	server_name				example.test;
}

server {	# <- 0.0.0.0:8080 already has its default server
	listen					8080;
	root					./www/fallback;
}
