# MUST BE REJECTED: two servers on one host:port with the same name: the first
# would get every request for it (decision 4). names compare case-insensitively,
# and the error points at the second server.
# expect: config error, line 11: conflicting server_name 'EXAMPLE.TEST' on 0.0.0.0:8080

server {
	listen					8080;
	server_name				example.test www.example.test;
}

server {	# <- example.test is taken on 0.0.0.0:8080
	listen					8080;
	server_name				EXAMPLE.TEST;
}
