# MUST BE REJECTED: two locations with the same path in one server: the second could
# never be matched.
# expect: config error, line 12: duplicate location '/images/'

server {
	listen					8080;

	location /images/ {
		root				./www/images;
	}

	location /images/ {	# <- the same path again
		root				./www/pictures;
	}
}
