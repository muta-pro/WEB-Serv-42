# MUST BE REJECTED: return takes a redirect code: 301, 302, 303, 307 or 308.
# 304 is a 3xx, but a cache answer with no body, not "go to this URL".
# expect: config error, line 9: status code '304' is not a redirect (301, 302, 303, 307 or 308)

server {
	listen					8080;

	location /old/ {
		return				304 /;	# <- 3xx, but not a redirect
	}
}
