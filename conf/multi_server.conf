# realistic corpus entry: several servers, shared ports, virtual hosts.
#
# blocks 1 and 2 both listen on 0.0.0.0:8080. ServerManager must open ONE
# socket for that pair and keep both configs behind it, then pick between them
# with the Host header:
#
#   Host: alpha.test  -> block 1
#   Host: beta.test   -> block 2
#   Host: anything    -> block 1, because it is declared first for :8080
#                        and is therefore the default server for it
#
# test with:  curl --resolve beta.test:8080:127.0.0.1 http://beta.test:8080/

server {
	listen					0.0.0.0:8080;
	server_name				alpha.test www.alpha.test;

	root					./www/html;
	index					index.html;
	client_max_body_size	2M;

	error_page 404			/errors/404.html;

	location / {
		methods				GET;
	}

	location /errors/ {
		root				./www/errors;
		internal;
	}

	location /api/ {
		root				./www/html;
		methods				GET POST DELETE;
	}
}

server {
	listen					0.0.0.0:8080;
	server_name				beta.test;

	root					./www/html;
	index					index.html;

	location / {
		methods				GET;
		autoindex			on;
	}
}

# one server, two ports - both reach the same document tree. this is why
# listens is a vector rather than a single host/port pair.
server {
	listen					127.0.0.1:8081;
	listen					127.0.0.1:8082;
	server_name				admin.test;

	root					./www/html;
	index					index.html;
	client_max_body_size	512k;

	location / {
		methods				GET;
	}

	location /upload/ {
		root				./www/uploads;
		methods				POST DELETE;
		upload_store		./www/uploads;
	}
}
