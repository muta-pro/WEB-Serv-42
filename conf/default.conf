# webserv - default configuration
#
# SYNTAX  nginx-flavoured, not nginx-identical.
#   #     comment, runs to end of line
#   ;     terminates every simple directive
#   { }   delimit blocks
#   1M    size suffixes (k/K m/M g/G) are accepted on client_max_body_size
#
# ROOT IS ALIAS-STYLE everywhere in this file: the matched location prefix is
# stripped from the URL before the remainder is appended to root. the commented
# /kapouet block at the bottom is the subject's own example of that rule.

server {
	listen					0.0.0.0:8080;
	server_name				localhost;

	client_max_body_size	1M;

	# server-level root/index/autoindex/methods are DEFAULTS ONLY. the parser
	# copies them into every location below and nothing reads them at runtime.
	root					./www/html;
	index					index.html;
	autoindex				off;
	methods					GET;

	# error_page values are URIs, not filesystem paths. each is re-resolved
	# through normal location matching - which is exactly why /errors/ exists.
	error_page	404			/errors/404.html;
	error_page	403			/errors/403.html;
	error_page	500 502 504	/errors/50x.html;

	# inherits everything from the server defaults above.
	location / {
	}

	# reachable only via error_page re-entry. a client asking for
	# /errors/404.html directly gets a 404, as in nginx.
	location /errors/ {
		root					./www/errors;
		internal;
	}

	# index is tried first; the listing is what happens when it is missing.
	location /files/ {
		root					./www/files;
		autoindex				on;
	}

	location /upload/ {
		root					./www/uploads;
		methods					GET POST DELETE;
		upload_store			./www/uploads;
		client_max_body_size	10M;
	}

	location /cgi-bin/ {
		root					./www/cgi-bin;
		methods					GET POST;
		cgi						.py /usr/bin/python3;
	}

	location /old/ {
		return					301 /;
	}

	# the subject's example, kept here as living documentation:
	#   "if URL /kapouet is rooted to /tmp/www, URL /kapouet/pouic/toto/pouet
	#    will search for /tmp/www/pouic/toto/pouet"
	# note /kapouet is absent from the result. the prefix is stripped, then the
	# remainder is appended. that is alias behaviour, not concatenation.
	#
	# location /kapouet {
	#     root /tmp/www;
	# }
}
