# MUST BE REJECTED. the parser is expected to throw ConfigError and the server
# must refuse to start.
#
# the first error here is the missing ';' after `listen 0.0.0.0:8080` on the
# line below. expected message shape:
#
#   config error, line 28: expected ';' before 'server_name'
#
# a parser stops at the first error, so the other rejections listed below each
# need their own file when the test corpus grows:
#
#   - unterminated block (missing '}' at EOF)
#   - '}' with no matching '{'
#   - unknown directive
#   - directive outside any block
#   - listen with a non-numeric or out-of-range port
#   - error_page value that is a filesystem path instead of a URI
#     (./www/errors/404.html - must start with '/')
#   - error_page with a status code outside 300-599
#   - location block with an empty root
#   - two locations declaring the same path
#   - client_max_body_size with an unknown suffix (10X)
#   - return with a code outside 3xx
#   - a file containing no server block at all

server {
	listen					0.0.0.0:8080
	server_name				broken.test;

	root					./www/html;
	index					index.html;

	location / {
		methods				GET;
	}
}
