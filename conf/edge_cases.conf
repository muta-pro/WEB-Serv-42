# adversarial but VALID. every line here must parse. it exists to pin the
# tokenizer's behaviour, not to be a pretty config.
#
# what it exercises:
#   - blank and whitespace-only lines, mixed tabs and spaces
#   - comments on their own line, after a directive, and inside a block
#   - '{', '}' and ';' with no surrounding whitespace (self-delimiting tokens)
#   - a whole server block written on one line
#   - every size suffix form
#   - a duplicated scalar directive. RULE: the last one wins, silently.
#   - error_page binding several codes at once
#   - no newline at end of file

server {

	listen 0.0.0.0:8080;# comment glued to the semicolon

		server_name		edge.test	;

	# duplicated on purpose - client_max_body_size ends up 4M, not 1M
	client_max_body_size 1M;
	client_max_body_size 4M;

	root ./www/html;
	index index.html;

	error_page 400 403 404 405 413 500 502 504 /errors/generic.html;

	location / {	# trailing comment inside a block header
		methods GET;
	}

	location /a/{root ./www/html;methods GET;}

	location /b/ {
		root				./www/html;
		# a comment
		methods		GET		POST	;
		client_max_body_size 512k;
	}

	location /c/ { root ./www/html; client_max_body_size 1G; }
}
server{listen 127.0.0.1:9090;root ./www/html;index index.html;location /{methods GET;}}