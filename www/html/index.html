<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ IVAN — WEBSERV TRACKER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
:root{
  --cyan:#22d3ee;--cyan-dark:#0891b2;--cyan-dim:#164e63;
  --cyan-glow:rgba(34,211,238,0.15);--cyan-glow2:rgba(34,211,238,0.08);
  --bg:#020d14;--bg2:#040f1a;--bg3:#071520;
  --card:#0a1e2e;--card2:#0c2438;
  --border:rgba(34,211,238,0.12);--border2:rgba(34,211,238,0.25);
  --text:#e0f7ff;--text-dim:#7ab8c8;--text-muted:#3d6e7a;
  --red:#f87171;--yellow:#fbbf24;--green:#34d399;--orange:#fb923c;--purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(34,211,238,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;top:-20vh;left:50%;transform:translateX(-50%);width:80vw;height:50vh;background:radial-gradient(ellipse,rgba(34,211,238,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(2,13,20,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);padding:0 20px;}
.header-inner{max-width:1800px;margin:0 auto;display:flex;align-items:center;gap:14px;height:58px;flex-wrap:nowrap;}
.logo{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:1rem;color:var(--cyan);letter-spacing:.08em;white-space:nowrap;text-shadow:0 0 20px rgba(34,211,238,.5);}
.logo span{color:var(--text-muted);}
.phase-nav{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none;}
.phase-nav::-webkit-scrollbar{display:none;}
.phase-btn{background:transparent;border:1px solid transparent;color:var(--text-muted);padding:5px 11px;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.05em;white-space:nowrap;transition:all .2s;}
.phase-btn:hover{border-color:var(--border2);color:var(--text);}
.phase-btn.active{color:#000;border-color:transparent;}
.filter-bar{display:flex;gap:3px;align-items:center;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:5px 13px;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:700;letter-spacing:.06em;transition:all .2s;white-space:nowrap;}
.filter-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.filter-btn.active{background:var(--cyan);border-color:var(--cyan);color:var(--bg);}
.progress-pill{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--cyan);background:var(--cyan-glow2);border:1px solid var(--border2);padding:4px 11px;border-radius:20px;white-space:nowrap;}

/* ── MAIN ── */
main{max-width:1800px;margin:0 auto;padding:20px;position:relative;z-index:1;}
.phase-section{display:none;}
.phase-section.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── STATS ── */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
@media(max-width:600px){.stats-bar{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:1.7rem;font-weight:800;color:var(--cyan);text-shadow:0 0 16px rgba(34,211,238,.4);line-height:1;}
.stat-label{font-size:.65rem;color:var(--text-muted);margin-top:3px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;}

/* ── PHASE HEADER ── */
.phase-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:18px 22px;background:var(--card);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;}
.phase-header-icon{font-size:1.8rem;}
.phase-header-info h2{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:800;letter-spacing:.04em;}
.phase-header-info p{color:var(--text-dim);font-size:.8rem;margin-top:2px;}
.phase-meta{margin-left:auto;text-align:right;flex-shrink:0;}
.phase-meta .duration{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text-dim);}
.phase-progress-bar{height:4px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:6px;width:100px;overflow:hidden;}
.phase-progress-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.phase-pct{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text-muted);margin-top:3px;}

/* ── KANBAN ── */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:860px){.kanban{grid-template-columns:1fr;}}
.kanban-col{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:160px;}
.col-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.col-dot{width:8px;height:8px;border-radius:50%;}
.col-dot.todo{background:var(--text-muted);}
.col-dot.doing{background:var(--yellow);box-shadow:0 0 8px var(--yellow);}
.col-dot.done{background:var(--green);box-shadow:0 0 8px var(--green);}
.col-title{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.1em;}
.col-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text-muted);background:rgba(255,255,255,.04);padding:2px 8px;border-radius:10px;}

/* ── TASK CARD ── */
.task-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px 13px 13px 17px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.task-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px;opacity:.8;}
.task-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.4);}
.task-card.hidden{display:none!important;}

.task-top{display:flex;align-items:flex-start;gap:8px;}
.task-checkbox{width:17px;height:17px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;cursor:pointer;}
.task-card.status-done .task-checkbox{background:var(--green);border-color:var(--green);}
.task-card.status-done .task-checkbox::after{content:'✓';font-size:10px;color:#000;font-weight:900;}
.task-card.status-doing .task-checkbox{border-color:var(--yellow);background:rgba(251,191,36,.12);}
.task-title{font-size:.82rem;font-weight:600;line-height:1.4;color:var(--text);flex:1;}
.task-card.status-done .task-title{color:var(--text-muted);text-decoration:line-through;}

.task-meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap;}
.task-time{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text-muted);background:rgba(255,255,255,.03);border:1px solid var(--border);padding:2px 7px;border-radius:4px;}
.tag{font-family:'JetBrains Mono',monospace;font-size:.58rem;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.04em;}
.tag-critical{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.2);}
.tag-tricky{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.2);}
.tag-test{background:rgba(34,211,238,.1);color:var(--cyan);border:1px solid rgba(34,211,238,.2);}
.tag-arch{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.2);}
.tag-struct{background:rgba(251,146,60,.12);color:var(--orange);border:1px solid rgba(251,146,60,.2);}

/* sub-progress on card */
.card-subprogress{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--text-muted);margin-left:auto;white-space:nowrap;}
.card-subbar{height:2px;background:rgba(255,255,255,.05);border-radius:1px;margin-top:6px;overflow:hidden;}
.card-subbar-fill{height:100%;border-radius:1px;transition:width .4s ease;}

/* ── EXPANDED DETAIL ── */
.task-expand{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.task-card.expanded .task-expand{display:block;}

/* ── TAB SWITCHER ── */
.detail-tabs{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.detail-tab{flex:1;padding:7px 4px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--text-muted);background:transparent;border:none;border-right:1px solid var(--border);transition:all .15s;white-space:nowrap;}
.detail-tab:last-child{border-right:none;}
.detail-tab:hover{color:var(--text);background:rgba(255,255,255,.03);}
.detail-tab.active{color:var(--bg);font-weight:800;}
.detail-tab[data-tab="tasks"].active{background:#22d3ee;color:#000;}
.detail-tab[data-tab="warnings"].active{background:#f87171;color:#000;}
.detail-tab[data-tab="tricks"].active{background:#fbbf24;color:#000;}
.detail-tab[data-tab="tests"].active{background:#34d399;color:#000;}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── TODO CHECKLIST ── */
.todo-list{list-style:none;}
.todo-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid rgba(34,211,238,.05);cursor:pointer;transition:background .15s;border-radius:4px;}
.todo-item:last-child{border-bottom:none;}
.todo-item:hover{background:rgba(34,211,238,.03);}
.todo-cb{width:15px;height:15px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.todo-item.checked .todo-cb{background:var(--cyan);border-color:var(--cyan);}
.todo-item.checked .todo-cb::after{content:'✓';font-size:9px;color:#000;font-weight:900;}
.todo-item.checked .todo-text{color:var(--text-muted);text-decoration:line-through;}
.todo-text{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-dim);line-height:1.5;flex:1;}

/* ── DETAIL LISTS ── */
.detail-list{list-style:none;}
.detail-list li{padding:5px 0 5px 18px;font-size:.76rem;color:var(--text-dim);line-height:1.5;border-bottom:1px solid rgba(255,255,255,.03);position:relative;}
.detail-list li:last-child{border-bottom:none;}
.detail-list li::before{position:absolute;left:0;font-family:'JetBrains Mono',monospace;font-size:.75rem;}
.warn-list li::before{content:'⚠';color:var(--red);}
.trick-list li::before{content:'⚡';color:var(--yellow);}
.test-list li{cursor:pointer;transition:background .15s;border-radius:4px;padding-left:22px;}
.test-list li:hover{background:rgba(52,211,153,.04);}
.test-list li::before{content:'▷';color:var(--green);}
.test-list li.test-done::before{content:'✓';color:var(--green);}
.test-list li.test-done{color:var(--text-muted);text-decoration:line-through;}

/* ── STATUS CONTROLS ── */
.task-controls{display:none;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.task-card.expanded .task-controls{display:flex;}
.status-btn{flex:1;padding:6px 6px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.04em;}
.status-btn.todo-btn:hover{border-color:var(--text-muted);color:var(--text-muted);}
.status-btn.doing-btn:hover{border-color:var(--yellow);color:var(--yellow);}
.status-btn.done-btn:hover{border-color:var(--green);color:var(--green);}
.status-btn.active-todo{border-color:var(--text-muted);color:var(--text-muted);background:rgba(255,255,255,.04);}
.status-btn.active-doing{border-color:var(--yellow);color:var(--yellow);background:rgba(251,191,36,.08);}
.status-btn.active-done{border-color:var(--green);color:var(--green);background:rgba(52,211,153,.08);}

/* timing */
.timing-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.timing-input{background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:4px 8px;width:62px;text-align:center;}
.timing-input:focus{outline:none;border-color:var(--cyan);}
.timing-label{font-family:'JetBrains Mono',monospace;font-size:.64rem;color:var(--text-muted);}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:3px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--card2);border:1px solid var(--cyan);color:var(--cyan);padding:9px 16px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.72rem;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ IVAN<span> // WEBSERV</span></div>
    <nav class="phase-nav" id="phaseNav"></nav>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="todo">TODO</button>
      <button class="filter-btn" data-filter="doing">DOING</button>
      <button class="filter-btn" data-filter="done">DONE</button>
      <button class="action-btn" style="color: var(--cyan); border-color: var(--cyan);" onclick="exportData()">📤 EXPORT</button>
      <button class="action-btn" style="color: var(--yellow); border-color: var(--yellow);" onclick="importData()">📥 IMPORT</button>
    </div>
    <div class="progress-pill" id="globalProgress">0 / 0</div>
  </div>
</header>

<main>
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total Tasks</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--text-muted)" id="statTodo">0</div><div class="stat-label">To Do</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--yellow)" id="statDoing">0</div><div class="stat-label">In Progress</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)" id="statDone">0</div><div class="stat-label">Done</div></div>
  </div>
  <div id="phaseSections"></div>
</main>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
// DATA — All phases & tickets
// ══════════════════════════════════════════════════════
const PHASES = [
{
  id:'p0', label:'P0 — ARCH', icon:'🏗️', color:'#22d3ee',
  title:'PHASE 0 — ARCHITECTURE', subtitle:'2–3 days · No coding. Define stable contracts so everyone works independently.',
  duration:'2–3 days',
  tickets:[
    {
      id:'p0-1', title:'Define ConnectionState enum', hours:'2–3h', tags:['arch'],
      tasks:[
        'Create include/ConnectionState.h',
        'Add READING_HEADERS state',
        'Add READING_BODY state',
        'Add PROCESSING state',
        'Add WRITING_RESPONSE state',
        'Add CGI_RUNNING state',
        'Add CLOSED state',
        'Add a stateToString(ConnectionState) debug helper',
        'Agree with team and commit — no unilateral changes after Phase 0'
      ],
      warnings:[
        'Missing CLOSED state leads to zombie connections lingering in poll()',
        'Forgetting CGI_RUNNING causes poll() race — event loop won\'t know to watch CGI pipes',
        'State enum not in a shared header causes include hell and ODR violations',
        'Using int instead of enum class removes type safety — catch wrong-state bugs at compile time'
      ],
      tricks:[
        'Add a CGI_RUNNING sub-state concept: note in comments whether stdin or stdout phase is active',
        'Use enum class ConnectionState (not plain enum) to prevent accidental int comparisons',
        'Put the enum in a namespace or use enum class — avoids name collisions with system headers'
      ],
      tests:[
        'Print every state transition to stderr during Phase 1 — manually trigger each one',
        'Ensure every state value has a matching case in the event loop switch — enable -Wswitch-enum',
        'Feed malformed data and assert no state outside the enum is ever reached',
        'Compile with -Wall -Wextra -Werror — zero warnings'
      ]
    },
    {
      id:'p0-2', title:'Define Connection struct (runtime only)', hours:'2–3h', tags:['arch','struct'],
      tasks:[
        'Create include/Connection.h',
        'Add field: int fd',
        'Add field: std::string recvBuffer',
        'Add field: std::string sendBuffer',
        'Add field: ConnectionState state',
        'Add field: size_t bytesSent (0-initialized)',
        'Add field: bool keepAlive',
        'Add field: time_t lastActivity',
        'Add field: bool requestReady',
        'Add field: bool responseReady',
        'Add field: int serverConfigIdx (which vhost config owns this connection)',
        'Add resetForNextRequest() method that clears all per-request fields',
        'Zero-init all fields in constructor'
      ],
      warnings:[
        'Stuffing HTTP data into Connection = parser contamination — Connection is runtime ONLY',
        'No bytesSent tracking → partial send corruption, client gets truncated response',
        'lastActivity not set on construction → timeout fires immediately',
        'requestReady / responseReady not reset on keep-alive → stale flags cause double-processing',
        'recvBuffer growth unbounded on malicious slow client — plan max size now'
      ],
      tricks:[
        'Keep Connection a plain value type — no virtuals, no heap beyond std containers',
        'resetForNextRequest() clears recvBuffer, sendBuffer, sets bytesSent=0, requestReady=false, responseReady=false',
        'Do NOT store any parsed HTTP in Connection — that belongs in HttpRequest which is separate'
      ],
      tests:[
        'Unit: default-constructed Connection has all booleans false, bytesSent 0',
        'Unit: resetForNextRequest() resets all per-request fields, fd and keepAlive survive',
        'Simulate keep-alive: call reset then inject second request — verify clean state',
        'sizeof(Connection) sanity check — log it, should be small (<256 bytes baseline)'
      ]
    },
    {
      id:'p0-3', title:'Establish EventLoop socket ownership rule', hours:'1–2h', tags:['arch','critical'],
      tasks:[
        'Write RULE comment block at top of EventLoop.h: ONLY EventLoop calls recv/send/close',
        'Grep codebase for any recv/send/close outside event loop files — fix them',
        'Create EventLoop class skeleton with addConnection(), removeConnection()',
        'Decide: does EventLoop own Connection objects, or does a ConnectionManager?',
        'Document CGI pipe fds as also owned by EventLoop, not CGIManager',
        'Agree with team — write it in README or shared doc'
      ],
      warnings:[
        'Any module calling recv() directly bypasses buffering and state machine — instant chaos',
        'Double-close of fd is crash or silent UB — only one owner, only one close',
        'Parser or router closing fd on error = double-close bomb when event loop also tries to close',
        'CGI spawner closing a pipe fd after handing it to event loop = use-after-close'
      ],
      tricks:[
        'Add a debug wrapper: int safeClose(int fd) that asserts fd >= 0 and logs in debug mode',
        'Use RAII fd wrapper class for pipe fds — destructor closes if not yet released to event loop'
      ],
      tests:[
        'grep -rn "recv\\|send\\|::close" src/ — must only appear in EventLoop.cpp',
        'Introduce deliberate double-close in test binary — confirm ASAN/ubsan catches it',
        'Code review: every path that creates a fd must have a documented owner'
      ]
    },
    {
      id:'p0-4', title:'Define CGIProcess struct', hours:'2h', tags:['arch','struct'],
      tasks:[
        'Create include/CGIProcess.h',
        'Add field: pid_t pid (-1 initialized)',
        'Add field: int stdinFd (-1 initialized)',
        'Add field: int stdoutFd (-1 initialized)',
        'Add field: time_t startTime',
        'Add field: bool finished',
        'Add field: std::string outputBuffer (accumulates CGI stdout)',
        'Add field: int connectionFd (which client connection owns this CGI)',
        'Add isTimedOut(int timeoutSecs) const helper',
        'Add cleanup() method that closes fds and sets finished=true'
      ],
      warnings:[
        'Not initializing stdinFd/stdoutFd to -1 → close(-1) = disaster (closes fd 0 or random fd)',
        'No startTime = CGI timeout impossible',
        'Forgetting finished flag = CGI output read after zombie already reaped → garbage data',
        'Not linking CGIProcess to its owning connection → orphaned response when CGI finishes'
      ],
      tricks:[
        'Store stdoutFd in poll() alongside connection fds — same event loop, same treatment',
        'Map cgi_stdout_fd → Connection* in EventLoop so incoming CGI data routes to correct client',
        'cleanup() must be idempotent — safe to call twice'
      ],
      tests:[
        'Spawn trivial child (echo hello), verify all CGIProcess fields set correctly before execve',
        'Print CGIProcess before and after spawn — assert no garbage values, all fds > 0',
        'Call cleanup() twice — second call must not crash (idempotent check)',
        'isTimedOut() with startTime = now-100, timeout=30 — must return true'
      ]
    },
    {
      id:'p0-5', title:'Agree on parser.feed() interface contract', hours:'2–3h', tags:['arch','critical'],
      tasks:[
        'Define ParseResult enum: PARSE_INCOMPLETE, PARSE_COMPLETE, PARSE_ERROR',
        'Define feed() signature: ParseResult feed(const char* data, size_t len)',
        'Agree: feed() returns bytes consumed (not just status) so caller knows offset',
        'Write FakeParser class that implements this interface using \\r\\n\\r\\n detection',
        'Verify FakeParser compiles and works end-to-end in Phase 1 skeleton',
        'Document: parser NEVER touches sockets, NEVER closes fds',
        'Agree on error codes: what does PARSE_ERROR carry (statusCode? message?)'
      ],
      warnings:[
        'Parser owning sockets = coupling nightmare — must never happen',
        'feed() returning void = no way to signal completion or error to caller',
        'No error return from feed() = silent parse failure, server sends garbage response',
        'Feed returning bool instead of enum = cannot distinguish INCOMPLETE from ERROR'
      ],
      tricks:[

function setStatus(id,v){ S.statuses[id]=v; saveState(); }
function getTodoDone(taskId,idx){ return !!(S.todos[taskId]||{})[idx]; }
function toggleTodo(taskId,idx){ if(!S.todos[taskId])S.todos[taskId]={}; S.todos[taskId][idx]=!S.todos[taskId][idx]; saveState(); }
function getTestDone(taskId,idx){ return !!(S.testsDone[taskId]||{})[idx]; }
function toggleTest(taskId,idx){ if(!S.testsDone[taskId])S.testsDone[taskId]={}; S.testsDone[taskId][idx]=!S.testsDone[taskId][idx]; saveState(); }
function getTime(id){ return S.times[id]||''; }
function setTime(id,v){ S.times[id]=v; saveState(); }

function todosCompleted(taskId, total){
  if(!S.todos[taskId]) return 0;
  return Object.values(S.todos[taskId]).filter(Boolean).length;
}

// ══════════════════════════════════════════════════════
// BUILD UI
// ══════════════════════════════════════════════════════
function buildPhaseNav(){
  const nav=document.getElementById('phaseNav');
  PHASES.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='phase-btn'+(p.id===S.currentPhase?' active':'');
    if(p.id===S.currentPhase){btn.style.background=p.color;btn.style.color='#000';}
    btn.textContent=p.label;
    btn.onclick=()=>switchPhase(p.id);
    nav.appendChild(btn);
  });
}

function switchPhase(id){
  S.currentPhase=id;
  document.querySelectorAll('.phase-btn').forEach((b,i)=>{
    const p=PHASES[i];
    b.className='phase-btn'+(p.id===id?' active':'');
    b.style.background=p.id===id?p.color:'';
    b.style.color=p.id===id?'#000':'';
  });
  document.querySelectorAll('.phase-section').forEach(s=>{
    s.classList.toggle('active',s.dataset.phase===id);
  });
}

function buildAll(){
  const container=document.getElementById('phaseSections');
  // Inject accent styles
  const styleEl=document.createElement('style');
  PHASES.forEach(p=>{
    (p.tickets||[]).forEach(t=>{
      styleEl.textContent+=`#card_${t.id}::before{background:${p.color};}\n`;
    });
  });
  document.head.appendChild(styleEl);

  PHASES.forEach(phase=>{
    const section=document.createElement('div');
    section.className='phase-section'+(phase.id===S.currentPhase?' active':'');
    section.dataset.phase=phase.id;
    section.innerHTML=`
      <div class="phase-header" style="border-left:4px solid ${phase.color}">
        <div class="phase-header-icon">${phase.icon}</div>
        <div class="phase-header-info">
          <h2 style="color:${phase.color}">${phase.title}</h2>
          <p>${phase.subtitle}</p>
        </div>
        <div class="phase-meta">
          <div class="duration">⏱ ${phase.duration}</div>
          <div class="phase-progress-bar"><div class="phase-progress-fill" id="pbar_${phase.id}" style="background:${phase.color}"></div></div>
          <div class="phase-pct" id="ppct_${phase.id}">0%</div>
        </div>
      </div>
      <div class="kanban">
        <div class="kanban-col" id="col_todo_${phase.id}">
          <div class="col-header"><div class="col-dot todo"></div><span class="col-title" style="color:var(--text-muted)">TO DO</span><span class="col-count" id="cnt_todo_${phase.id}">0</span></div>
        </div>
        <div class="kanban-col" style="background:rgba(13,32,32,.6)" id="col_doing_${phase.id}">
          <div class="col-header"><div class="col-dot doing"></div><span class="col-title" style="color:var(--yellow)">DOING</span><span class="col-count" id="cnt_doing_${phase.id}">0</span></div>
        </div>
        <div class="kanban-col" style="background:rgba(13,32,15,.6)" id="col_done_${phase.id}">
          <div class="col-header"><div class="col-dot done"></div><span class="col-title" style="color:var(--green)">DONE</span><span class="col-count" id="cnt_done_${phase.id}">0</span></div>
        </div>
      </div>`;
    container.appendChild(section);
    (phase.tickets||[]).forEach(ticket=>buildCard(ticket,phase,section));
  });
}

function buildCard(ticket, phase, section){
  const status=getStatus(ticket.id);
  const card=document.createElement('div');
  card.className=`task-card status-${status}`;
  card.id=`card_${ticket.id}`;
  card.dataset.status=status;
  card.dataset.phase=phase.id;

  const tags=(ticket.tags||[]).map(t=>`<span class="tag tag-${t}">${t.toUpperCase()}</span>`).join('');
  const todoTotal=ticket.tasks.length;
  const todoDone=todosCompleted(ticket.id, todoTotal);
  const savedTime=getTime(ticket.id);
  const pct=todoTotal>0?Math.round(todoDone/todoTotal*100):0;

  card.innerHTML=`
    <div class="task-top">
      <div class="task-checkbox" id="chk_${ticket.id}"></div>
      <div class="task-title">${ticket.title}</div>
    </div>
    <div class="task-meta">
      <span class="task-time">⏱ ${ticket.hours}</span>
      ${tags}
      <span class="card-subprogress" id="subprog_${ticket.id}">${todoDone}/${todoTotal}</span>
    </div>
    <div class="card-subbar"><div class="card-subbar-fill" id="subbar_${ticket.id}" style="background:${phase.color};width:${pct}%"></div></div>

    <div class="task-expand" id="expand_${ticket.id}">
      <div class="detail-tabs">
        <button class="detail-tab active" data-tab="tasks" onclick="switchTab('${ticket.id}','tasks',event)">📋 TASKS</button>
        <button class="detail-tab" data-tab="warnings" onclick="switchTab('${ticket.id}','warnings',event)">⚠ RISKS</button>
        <button class="detail-tab" data-tab="tricks" onclick="switchTab('${ticket.id}','tricks',event)">⚡ TRICKS</button>
        <button class="detail-tab" data-tab="tests" onclick="switchTab('${ticket.id}','tests',event)">✓ TESTS</button>
      </div>

      <div class="tab-panel active" id="tab_tasks_${ticket.id}">
        <ul class="todo-list">${ticket.tasks.map((task,i)=>`
          <li class="todo-item${getTodoDone(ticket.id,i)?' checked':''}" id="todo_${ticket.id}_${i}" onclick="clickTodo('${ticket.id}',${i},event)">
            <div class="todo-cb"></div>
            <span class="todo-text">${task}</span>
          </li>`).join('')}
        </ul>
      </div>

      <div class="tab-panel" id="tab_warnings_${ticket.id}">
        <ul class="detail-list warn-list">${(ticket.warnings||[]).map(w=>`<li>${w}</li>`).join('')}</ul>
      </div>

      <div class="tab-panel" id="tab_tricks_${ticket.id}">
        <ul class="detail-list trick-list">${(ticket.tricks||[]).map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>

      <div class="tab-panel" id="tab_tests_${ticket.id}">
        <ul class="detail-list test-list">${(ticket.tests||[]).map((t,i)=>`
          <li class="${getTestDone(ticket.id,i)?'test-done':''}" id="test_${ticket.id}_${i}" onclick="clickTest('${ticket.id}',${i},event)">${t}</li>`).join('')}
        </ul>
      </div>

      <div class="task-controls">
        <button class="status-btn todo-btn${status==='todo'?' active-todo':''}" onclick="setCardStatus('${ticket.id}','${phase.id}','todo',event)">TODO</button>
        <button class="status-btn doing-btn${status==='doing'?' active-doing':''}" onclick="setCardStatus('${ticket.id}','${phase.id}','doing',event)">DOING</button>
        <button class="status-btn done-btn${status==='done'?' active-done':''}" onclick="setCardStatus('${ticket.id}','${phase.id}','done',event)">DONE</button>
        <div class="timing-row" style="margin-top:0">
          <input class="timing-input" type="number" min="0" max="999" placeholder="0"
            value="${savedTime}" onchange="saveTimeSpent('${ticket.id}',this.value)" onclick="event.stopPropagation()" title="Hours spent">
          <span class="timing-label">hrs</span>
        </div>
      </div>
    </div>`;

  // Checkbox click
  card.querySelector('.task-checkbox').onclick=(e)=>{
    e.stopPropagation();
    const cur=getStatus(ticket.id);
    const nxt=cur==='todo'?'doing':cur==='doing'?'done':'todo';
    setCardStatus(ticket.id,phase.id,nxt,e);
  };

  // Card click to expand
  card.onclick=(e)=>{
    if(e.target.closest('.task-checkbox')||e.target.closest('.status-btn')||e.target.tagName==='INPUT'||e.target.closest('.detail-tab')||e.target.closest('.todo-item')||e.target.tagName==='LI') return;
    card.classList.toggle('expanded');
  };

  // Place in correct column
  const col=section.querySelector(`#col_${status}_${phase.id}`);
  if(col) col.appendChild(card);
}

function switchTab(ticketId, tab, e){
  e.stopPropagation();
  const expand=document.getElementById(`expand_${ticketId}`);
  expand.querySelectorAll('.detail-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  expand.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab_${tab}_${ticketId}`));
}

function clickTodo(ticketId, idx, e){
  e.stopPropagation();
  toggleTodo(ticketId,idx);
  const item=document.getElementById(`todo_${ticketId}_${idx}`);
  if(item) item.classList.toggle('checked');
  updateSubProgress(ticketId);
  updateCounts(document.getElementById(`card_${ticketId}`).dataset.phase);
  updateStats();
}

function clickTest(ticketId, idx, e){
  e.stopPropagation();
  toggleTest(ticketId,idx);
  const item=document.getElementById(`test_${ticketId}_${idx}`);
  if(item) item.classList.toggle('test-done');
  saveState();
}

function updateSubProgress(ticketId){
  const phase=PHASES.find(p=>(p.tickets||[]).some(t=>t.id===ticketId));
  if(!phase) return;
  const ticket=phase.tickets.find(t=>t.id===ticketId);
  if(!ticket) return;
  const total=ticket.tasks.length;
  const done=todosCompleted(ticketId,total);
  const pct=total>0?Math.round(done/total*100):0;
  const sp=document.getElementById(`subprog_${ticketId}`);
  const sb=document.getElementById(`subbar_${ticketId}`);
  if(sp) sp.textContent=`${done}/${total}`;
  if(sb) sb.style.width=`${pct}%`;
}

function setCardStatus(ticketId, phaseId, status, e){
  if(e) e.stopPropagation();
  setStatus(ticketId,status);
  const card=document.getElementById(`card_${ticketId}`);
  if(!card) return;
  // Update class
  card.className=card.className.replace(/status-\w+/,`status-${status}`);
  card.dataset.status=status;
  // Update checkbox appearance
  const chk=card.querySelector('.task-checkbox');
  if(chk){ chk.style.cssText=''; }
  // Update buttons
  card.querySelectorAll('.status-btn').forEach(b=>{
    b.classList.remove('active-todo','active-doing','active-done');
    if(b.classList.contains('todo-btn')&&status==='todo') b.classList.add('active-todo');
    if(b.classList.contains('doing-btn')&&status==='doing') b.classList.add('active-doing');
    if(b.classList.contains('done-btn')&&status==='done') b.classList.add('active-done');
  });
  // Move to correct column
  const section=document.querySelector(`.phase-section[data-phase="${phaseId}"]`);
  const col=section&&section.querySelector(`#col_${status}_${phaseId}`);
  if(col){ card.classList.remove('expanded'); col.appendChild(card); }
  updateCounts(phaseId);
  updateStats();
  applyFilter(S.filter);
}

function saveTimeSpent(id,v){ setTime(id,v); }

function updateCounts(phaseId){
  const phase=PHASES.find(p=>p.id===phaseId);
  if(!phase) return;
  ['todo','doing','done'].forEach(s=>{
    const col=document.getElementById(`col_${s}_${phaseId}`);
    const cnt=document.getElementById(`cnt_${s}_${phaseId}`);
    if(col&&cnt) cnt.textContent=col.querySelectorAll('.task-card').length;
  });
  const total=(phase.tickets||[]).length;
  const done=(phase.tickets||[]).filter(t=>getStatus(t.id)==='done').length;
  const pct=total>0?Math.round(done/total*100):0;
  const bar=document.getElementById(`pbar_${phaseId}`);
  const pct_el=document.getElementById(`ppct_${phaseId}`);
  if(bar) bar.style.width=`${pct}%`;
  if(pct_el) pct_el.textContent=`${pct}%`;
}

function updateStats(){
  let total=0,todo=0,doing=0,done=0;
  PHASES.forEach(p=>(p.tickets||[]).forEach(t=>{
    total++;
    const s=getStatus(t.id);
    if(s==='todo')todo++;else if(s==='doing')doing++;else done++;
  }));
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statTodo').textContent=todo;
  document.getElementById('statDoing').textContent=doing;
  document.getElementById('statDone').textContent=done;
  document.getElementById('globalProgress').textContent=`${done}/${total} done`;
}

function applyFilter(filter){
  S.filter=filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
  document.querySelectorAll('.task-card').forEach(card=>{
    const show=filter==='all'||card.dataset.status===filter;
    card.classList.toggle('hidden',!show);
  });
}

let toastT;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1600);
}

// ══════════════════════════════════════════════════════
// EXPORT / IMPORT LOGIC (FILE DOWNLOAD METHOD)
// ══════════════════════════════════════════════════════
function exportData() {
  // 1. Gather the data
  const saveData = JSON.stringify(S, null, 2);
  
  // 2. Create an invisible file out of it
  const blob = new Blob([saveData], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  
  // 3. Create an invisible link, click it to download, then destroy it
  const a = document.createElement('a');
  a.href = url;
  a.download = "ivan_tracker_save.json"; // This is the file name
  document.body.appendChild(a);
  a.click();
  
  // 4. Clean up
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('💾 Save file downloaded!');
}

function importData() {
  // 1. Create an invisible file upload button
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json'; // Only allow JSON files
  
  // 2. What to do when a file is selected
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed && typeof parsed === 'object') {
          S = { ...S, ...parsed }; // Merge the new data
          saveState();             // Save to browser
          location.reload();       // Refresh to show changes
        }
      } catch (err) {
        alert("❌ Invalid save file! Make sure you selected the right JSON file.");
      }
    };
    reader.readAsText(file); // Read the file
  };
  
  // 3. Trigger the file upload window
  input.click();
}

// ── FILTER BUTTONS ──
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.onclick=()=>applyFilter(b.dataset.filter);
});

// ── INIT ──
loadState();
buildPhaseNav();
buildAll();
PHASES.forEach(p=>updateCounts(p.id));
updateStats();
applyFilter(S.filter);
</script>
